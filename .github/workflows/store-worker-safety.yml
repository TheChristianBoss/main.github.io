name: Store Worker safety checks

on:
  pull_request:
    paths:
      - 'workers/**'
      - 'package.json'
      - '.github/workflows/store-worker-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker-safety:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Worker JavaScript syntax
        run: |
          node --check workers/store-api-secure.js
          node --check workers/tests/store-payment-webhook.test.mjs
          node --check workers/tests/store-order-kv-required.test.mjs
          node --check workers/tests/store-checkout-price-integrity.test.mjs
          node --check workers/tests/store-automatic-fulfillment.test.mjs
      - name: Verify payment, retry protection and server prices
        run: |
          node workers/tests/store-payment-webhook.test.mjs
          node workers/tests/store-order-kv-required.test.mjs
          node workers/tests/store-checkout-price-integrity.test.mjs
          node workers/tests/store-automatic-fulfillment.test.mjs
